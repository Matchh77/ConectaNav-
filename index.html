body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{background:var(--card);border:1px solid var(--border)}
.chip{border:1px solid var(--border);color:var(--text);transition:.15s;background:transparent}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.lb{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.025em}

.tag{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--brand-light);color:var(--brand)}
.mut{color:var(--muted)}
.tab-btn{position:relative;padding:12px 14px;font-size:13px;font-weight:600;color:var(--muted);transition:.2s;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:var(--brand);border-color:var(--brand);font-weight:700}
.toast{animation:up .25s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}

// Configuração Supabase
const cfg = window.CONECTANAV || {};

// Estados em branco

// ==================== HELPER DE NORMALIZAÇÃO & LIGAÇÃO DE TAGS ====================
function normalizeText(str) {
  return String(str || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, ' ')
    .trim()
    .replace(/\s+/g, ' ');
}

// Mapa de sinônimos e afinidades semânticas
const SYNONYMS = {
  'caixa': ['operador de caixa', 'frente de caixa', 'caixa registradora', 'pdv'],
  'vendas': ['vendedor', 'vendedora', 'balconista', 'atendimento e vendas', 'comercial', 'negociacao'],
  'solar': ['fotovoltaica', 'sistemas fotovoltaicos', 'energia solar', 'instalacao solar', 'eletricidade'],
  'fotovoltaica': ['solar', 'sistemas fotovoltaicos', 'energia solar', 'eletricista solar'],
  'office': ['excel', 'word', 'pacote office', 'informatica', 'planilhas'],
  'excel': ['pacote office', 'planilhas', 'excel avancado', 'planilha excel'],
  'estoque': ['reposicao de estoque', 'almoxarifado', 'controle de estoque', 'estoquista', 'conferente'],
  'ti': ['informatica', 'computacao', 'suporte tecnico', 'programacao', 'desenvolvimento web'],
  'marketing': ['redes sociais', 'marketing digital', 'divulgacao', 'design', 'canva'],
  'agro': ['agronomia', 'agropecuaria', 'safra', 'trator', 'campo', 'mecanizacao agricola']
};

function tagsMatch(tag1, tag2) {
  const n1 = normalizeText(tag1);
  const n2 = normalizeText(tag2);
  if (!n1 || !n2) return false;
  if (n1 === n2) return true;
  if (n1.includes(n2) || n2.includes(n1)) return true;
  for (const [key, list] of Object.entries(SYNONYMS)) {
    const normList = [key, ...list].map(normalizeText);
    const has1 = normList.some(item => n1.includes(item) || item.includes(n1));
    const has2 = normList.some(item => n2.includes(item) || item.includes(n2));
    if (has1 && has2) return true;
  }
  return false;
}

function getAllKnownSkills() {
  const set = new Set(DEFAULT_SKILLS);
  (S.jobs || []).forEach(j => (j.tags || []).forEach(t => t && set.add(t)));
  (S.cands || []).forEach(c => (c.tags || []).forEach(t => t && set.add(t)));
  (D.tags || []).forEach(t => t && set.add(t));
  (J.tags || []).forEach(t => t && set.add(t));
  return Array.from(set).sort();
}

function okTags(a) {
  return Array.isArray(a) ? a.filter(t => typeof t === 'string' && t.trim().length > 0) : [];
}

// ==================== CÁLCULO DE MATCH SCORE ====================
function score(c, j) {
  if (!j) return 0;
  let matchedCount = 0;
  if (j.tags && j.tags.length > 0) {
    j.tags.forEach(jt => {
      const has = (c.tags || []).some(ct => tagsMatch(ct, jt));
      if (has) matchedCount++;
    });
  }
  const tagRatio = j.tags && j.tags.length ? (matchedCount / j.tags.length) : 1;
  const turnoRatio = (c.turno === j.turno || c.turno === 'Integral') ? 1 : 0;
  const bairroRatio = (c.bairro === j.bairro) ? 1 : ((NEI[j.bairro] || []).includes(c.bairro) ? 0.5 : 0);

  // Se a vaga especificou Área Acadêmica CNPq
  if (j.area && j.area.trim()) {
    const areaRatio = (c.area === j.area) ? 1 : 0;
    return Math.round(tagRatio * 40 + areaRatio * 20 + turnoRatio * 20 + bairroRatio * 20);
  }
  return Math.round(tagRatio * 50 + turnoRatio * 25 + bairroRatio * 25);
}

function getMatchedTags(c, j) {
  if (!j || !j.tags) return [];
  return (c.tags || []).filter(ct => j.tags.some(jt => tagsMatch(ct, jt)));
}

// ==================== HELPERS DE UI ====================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const chip = (l, a, fn) => `<button type="button" onclick="${fn}" class="chip px-3 py-1.5 rounded-xl text-xs sm:text-sm ${a ? 'active' : ''}">${esc(l)}</button>`;
const inp = (l, v, fn, ph, t = 'text') => `<div><label class="lb">${l}</label><input type="${t}" value="${esc(v)}" oninput="${fn}" placeholder="${ph}" class="fi"></div>`;
const sel = (l, opts, v, fn) => `<div><label class="lb">${l}</label><select onchange="${fn}" class="fi">${opts.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`;

function toast(m) {
  const e = document.createElement('div');
  e.className = 'toast px-4 py-2.5 rounded-xl shadow-lg text-sm font-semibold text-white text-center pointer-events-auto';
  e.style.background = '#0052CC';
  e.textContent = m;
  $('toasts').appendChild(e);
  setTimeout(() => {
    e.style.transition = 'opacity .3s';
    e.style.opacity = '0';
    setTimeout(() => e.remove(), 300);
  }, 3200);
}

function notify(t, b) {
  toast(t + ' ' + b);
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(t, { body: b, icon: '/WhatsApp Image 2026-11-09 at 09.20.21.jpeg' });
    }
  } catch (e) {}
}

function maskPhone(el) {
  let v = el.value.replace(/\D/g, '').slice(0, 11);
  v = v.length > 10 ? v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3')
    : v.length > 6 ? v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3')
    : v.length > 2 ? v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2')
    : v.length ? '(' + v : '';
  el.value = v;
  D.phone = v;
}

const waNum = p => {
  let c = String(p || '').replace(/\D/g, '');
  return (c.length === 10 || c.length === 11) ? '55' + c : c;
};

const upD = (f, v) => { D[f] = v; };
const upJ = (f, v) => { J[f] = v; };
const upC = (f, v) => { C[f] = v; };
const setD = (f, v) => { D[f] = v; render(); };
const setJ = (f, v) => { J[f] = v; render(); };

function tog(o, t) {
  const a = (o === 'D' ? D : J).tags;
  const i = a.indexOf(t);
  i > -1 ? a.splice(i, 1) : a.push(t);
  render();
}

function delTag(o, t) {
  const a = (o === 'D' ? D : J).tags;
  const i = a.indexOf(t);
  if (i > -1) {
    a.splice(i, 1);
    render();
  }
}

function addCustomTag(o) {
  const inpEl = $(`tagInp_${o}`);
  if (!inpEl) return;
  const val = inpEl.value.trim();
  if (!val) return;
  const arr = (o === 'D' ? D : J).tags;
  if (!arr.includes(val)) {
    arr.push(val);
  }
  inpEl.value = '';
  const sg = $(`tagSuggest_${o}`);
  if (sg) sg.classList.add('hidden');
  render();
}

function onTagInput(o, val) {
  const sg = $(`tagSuggest_${o}`);
  if (!sg) return;
  const term = normalizeText(val);
  if (!term) {
    sg.classList.add('hidden');
    return;
  }
  const all = getAllKnownSkills();
  const filtered = all.filter(s => normalizeText(s).includes(term)).slice(0, 8);
  if (!filtered.length) {
    sg.classList.add('hidden');
    return;
  }
  sg.innerHTML = filtered.map(s => `
    <div class="px-3 py-2 text-xs sm:text-sm hover:bg-blue-50 dark:hover:bg-slate-700 cursor-pointer flex justify-between items-center"
         onclick="pickSuggestedTag('${o}','${esc(s)}')">
      <span>${esc(s)}</span>
      <span class="text-[10px] text-blue-600 font-bold">+ Selecionar</span>
    </div>
  `).join('');
  sg.classList.remove('hidden');
}

function pickSuggestedTag(o, s) {
  const arr = (o === 'D' ? D : J).tags;
  if (!arr.includes(s)) arr.push(s);
  const inpEl = $(`tagInp_${o}`);
  if (inpEl) inpEl.value = '';
  const sg = $(`tagSuggest_${o}`);
  if (sg) sg.classList.add('hidden');
  render();
}

// ==================== DADOS & SUPABASE ====================
async function loadAll() {
  const uid = S.user.id;
  const p = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  S.role = p.data ? p.data.role : null;
  S.freeUsed = !!(p.data && p.data.free_unlock_used);
  if (S.role) {
    await loadData(true);
    subscribe();
    // Tab inicial coerente
    if (S.role === 'candidato') {
      S.tab = S.me ? 'vagas' : 'cadastro';
    } else {
      const own = S.jobs.filter(j => j.owner_id === uid);
      S.tab = own.length ? 'triagem' : 'vagas';
    }
  }
  S.loading = false;
  render();
}

async function loadData(first) {
  const uid = S.user.id;
  S.jobs = (await sb.from('jobs').select('*').order('created_at', { ascending: false })).data || [];
  S.jobs.forEach(j => j.tags = okTags(j.tags));

  if (S.role === 'candidato') {
    const old = Object.fromEntries(S.apps.map(a => [a.id, a.status]));
    S.apps = (await sb.from('applications').select('*').eq('candidate_id', uid)).data || [];
    if (!first) {
      S.apps.forEach(a => {
        if (old[a.id] && old[a.id] !== a.status) {
          const j = S.jobs.find(x => x.id === a.job_id);
          notify('Candidatura atualizada', (j ? j.cargo + ': ' : '') + a.status);
        }
      });
    }
    if (first) {
      const me = (await sb.from('candidates').select('*').eq('user_id', uid).maybeSingle()).data;
      if (me) {
        me.tags = okTags(me.tags);
        S.me = me;
        const ph = (await sb.from('candidate_contacts').select('phone').eq('user_id', uid).maybeSingle()).data;
        const areaVal = me.area || 'Ciências Exatas e da Terra';
        const subs = CNPQ_AREAS[areaVal] || [];
        D = {
          name: me.name || '',
          age: me.age || '',
          phone: ph ? ph.phone : '',
          bairro: me.bairro || 'Centro',
          turno: me.turno || 'Manhã',
          area: areaVal,
          subarea: me.subarea || subs[0] || '',
          customSubarea: me.custom_subarea || '',
          tags: [...me.tags],
          courses: Array.isArray(me.courses) ? me.courses : []
        };
      }
    }
  } else {
    S.cands = ((await sb.from('candidates').select('*')).data || []).map(c => ({
      ...c,
      tags: okTags(c.tags),
      courses: Array.isArray(c.courses) ? c.courses : []
    }));
    S.apps = (await sb.from('applications').select('*')).data || [];
    S.unlocks = new Set(((await sb.from('unlocks').select('candidate_id').eq('company_id', uid)).data || []).map(x => x.candidate_id));
    await loadPhones();
    const own = S.jobs.filter(j => j.owner_id === uid);
    if (!own.find(j => j.id === S.selJob)) S.selJob = own[0] ? own[0].id : null;
    if (first && own[0]) J.company = own[0].company;
  }
}

async function loadPhones() {
  const ids = [...S.unlocks];
  if (!ids.length) return;
  const r = (await sb.from('candidate_contacts').select('user_id,phone').in('user_id', ids)).data || [];
  r.forEach(x => S.phones[x.user_id] = x.phone);
}

function subscribe() {
  if (S.ch) return;
  const f = async () => {
    await loadData(false);
    if (S.pix && S.unlocks.has(S.pix.id)) {
      closePix();
      toast('✅ Pagamento confirmado! Contato liberado.');
    }
    render();
  };
  S.ch = sb.channel('cn')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'applications' }, f)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'unlocks' }, f)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'jobs' }, f)
    .subscribe();
}

async function signUp() {

  if (AUTH.pw !== AUTH.pw2) return toast('⚠️ As senhas não conferem');

async function setNewPw() {

async function saveProfile() {
  const age = Number(D.age);
  if (!D.name.trim() || !age || D.phone.replace(/\D/g, '').length < 10) {
    return toast('⚠️ Preencha nome, idade e telefone válido');
  }
  if (age < 16 || age > 29) {
    return toast('⚠️ A plataforma atende jovens de 16 a 29 anos');
  }

  const row = {
    user_id: S.user.id,
    name: D.name.trim(),
    age,
    bairro: D.bairro,
    turno: D.turno,
    area: D.area,
    subarea: D.subarea,
    custom_subarea: D.customSubarea || null,
    tags: D.tags,
    courses: D.courses,
    updated_at: new Date().toISOString()
  };

  let r = await sb.from('candidates').upsert(row);
  if (r.error) {
    // Se a coluna area ou subarea não existirem no Supabase, tenta salvar sem elas e avisa
    if (r.error.message && (r.error.message.includes('column') || r.error.message.includes('area'))) {
      delete row.area;
      delete row.subarea;
      delete row.custom_subarea;
      r = await sb.from('candidates').upsert(row);
      toast('ℹ️ Execute migration_v2.sql no Supabase para salvar sua Área acadêmica');
    } else if (r.error.message && r.error.message.includes('check constraint')) {
      return toast('⚠️ Execute migration_v2.sql no SQL Editor do Supabase para destravar novas tags!');
    } else {
      return toast('⚠️ ' + r.error.message);
    }
  }

  const r2 = await sb.from('candidate_contacts').upsert({ user_id: S.user.id, phone: D.phone });
  if (r2.error) return toast('⚠️ ' + r2.error.message);

  S.me = { ...row };
  render();
  toast('✅ Perfil salvo com sucesso!');
}

function addCourse() {
  const h = Number(C.hours);
  if (!C.name.trim()) return toast('⚠️ Informe o nome do curso');
  if (!h || h < 1 || h > 400) return toast('⚠️ Carga horária entre 1 e 400 h');
  if (C.url && !/^https:\/\/\S+$/.test(C.url.trim())) return toast('⚠️ O link deve começar com https://');
  if (D.courses.length >= 10) return toast('Limite de 10 cursos');
  D.courses.push({ name: C.name.trim().slice(0, 80), hours: h, url: C.url.trim(), src: C.src });
  C = blankC();
  render();
  toast('Curso adicionado. Lembre-se de salvar seu perfil!');
}

function delCourse(i) {
  D.courses.splice(i, 1);

}

// ==================== EMPRESA: AÇÕES ====================
async function saveJob() {
  if (!J.company.trim() || !J.cargo.trim()) return toast('⚠️ Preencha empresa e cargo');
  const row = {
    company: J.company.trim(),
    bairro: J.bairro,
    cargo: J.cargo.trim(),
    turno: J.turno,
    area: J.area || null,
    tags: J.tags
  };

  let r = S.editJob
    ? await sb.from('jobs').update(row).eq('id', S.editJob)
    : await sb.from('jobs').insert({ ...row, owner_id: S.user.id }).select().single();

  if (r.error) {
    if (r.error.message && r.error.message.includes('column') && r.error.message.includes('area')) {
      delete row.area;
      r = S.editJob
        ? await sb.from('jobs').update(row).eq('id', S.editJob)
        : await sb.from('jobs').insert({ ...row, owner_id: S.user.id }).select().single();
    } else if (r.error.message && r.error.message.includes('check constraint')) {
      return toast('⚠️ Execute migration_v2.sql no SQL Editor do Supabase para destravar novas tags!');
    } else {
      return toast('⚠️ ' + r.error.message);
    }
  }

  toast(S.editJob ? '✏️ Vaga atualizada!' : '📢 Vaga publicada com sucesso!');
  if (!S.editJob && r.data) S.selJob = r.data.id;
  S.editJob = null;
  const c = J.company;
  J = blankJ();
  J.company = c;
  await loadData(false);
  render();
}

function editJob(id) {
  const j = S.jobs.find(x => x.id === id);
  if (!j) return;
  S.editJob = id;
  J = {
    company: j.company,
    bairro: j.bairro,
    cargo: j.cargo,
    turno: j.turno,
    area: j.area || '',
    tags: [...j.tags]
  };
  S.tab = 'vagas';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  S.editJob = null;
  J = blankJ();
  render();
}

async function toggleJob(id) {
  const j = S.jobs.find(x => x.id === id);
  const st = j.status === 'aberta' ? 'encerrada' : 'aberta';
  const r = await sb.from('jobs').update({ status: st }).eq('id', id);
  if (r.error) return toast('⚠️ ' + r.error.message);
  await loadData(false);
  render();
  toast(st === 'encerrada' ? '🔒 Vaga encerrada' : '🟢 Vaga reaberta');
}

async function delJob(id) {
  if (!confirm('Excluir esta vaga e todas as candidaturas relacionadas?')) return;
  const r = await sb.from('jobs').delete().eq('id', id);
  if (r.error) return toast('⚠️ ' + r.error.message);
  await loadData(false);
  render();
  toast('🗑️ Vaga excluída');
}

async function setAppStatus(id, st) {
  const r = await sb.from('applications').update({ status: st }).eq('id', id);
  if (r.error) return toast('⚠️ ' + r.error.message);
  await loadData(false);
  render();
  toast('Status atualizado');
}

function pickJob(id) {
  S.selJob = id;
  render();
}

async function unlock(id) {
  if (S.unlocks.has(id)) return;
  if (!S.freeUsed) {
    const r = await sb.rpc('unlock_free', { p_candidate: id });
    if (r.error) return toast('⚠️ ' + r.error.message);
    S.freeUsed = true;
    S.unlocks.add(id);
    await loadPhones();
    render();
    return toast('🎉 Contato desbloqueado! (1/1 Franquia Grátis usada)');
  }
  S.pix = { id, loading: true };
  render();
  try {
    const ses = (await sb.auth.getSession()).data.session;
    const r = await fetch('/api/pix-create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ses.access_token },
      body: JSON.stringify({ candidate_id: id })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Erro');
    S.pix = { id, ...j };
    render();
    pollT = setInterval(async () => {
      await loadData(false);
      if (S.unlocks.has(id)) {
        closePix();
        render();
        toast('✅ Pagamento confirmado! Contato liberado.');
      }
    }, 4000);
  } catch (e) {
    S.pix = null;
    render();
    toast('⚠️ ' + e.message);
  }
}

function closePix() {
  clearInterval(pollT);
  S.pix = null;
  $('modal').innerHTML = '';
}

function cancelPix() {
  closePix();
  render();
}

function copyPix() {
  navigator.clipboard.writeText(S.pix.qr_code).then(() => toast('Código Pix copiado!'));
}

function jobCard(j) {
  const a = S.apps.find(x => x.job_id === j.id);
  const closed = j.status === 'encerrada';
  const have = S.me ? S.me.tags : D.tags;
  const miss = j.tags.filter(t => !have.some(h => tagsMatch(h, t)));
  const st = a && STAT_UI[a.status];
  const candMock = S.me ? S.me : D;
  const matchPct = score(candMock, j);
  const matchColor = matchPct >= 70 ? 'text-green-700 bg-green-50' : matchPct >= 40 ? 'text-amber-700 bg-amber-50' : 'text-gray-600 bg-gray-100';

  return `
    <div class="card rounded-2xl p-4 sm:p-5 shadow-xs">
      <div class="flex items-start justify-between gap-2">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h3 class="font-bold text-base sm:text-lg">${esc(j.cargo)}</h3>
            <span class="text-xs font-bold px-2 py-0.5 rounded-full ${matchColor}">🎯 ${matchPct}% Match</span>
          </div>
          <p class="text-xs sm:text-sm mut mt-0.5">${esc(j.company)} · 📍 ${esc(j.bairro)} · 🕐 ${esc(j.turno)}</p>
          ${j.area ? `<p class="text-xs text-blue-700 mt-1 font-medium">🏛️ Área: ${esc(j.area)}</p>` : ''}
        </div>
        <span class="text-[10px] font-bold px-2.5 py-1 rounded-full shrink-0"
              style="background:${closed ? '#FEE2E2' : '#DCFCE7'};color:${closed ? '#991B1B' : '#166534'}">
          ${closed ? '🔒 Encerrada' : '🟢 Aberta'}
        </span>
      </div>

      <!-- Tags da vaga com destaque nas que combinam com o candidato -->
      <div class="flex flex-wrap gap-1.5 mt-3">
        ${j.tags.map(t => {
          const isMatch = have.some(h => tagsMatch(h, t));
          return `<span class="tag ${isMatch ? 'bg-green-100 text-green-800 font-semibold' : ''}">${isMatch ? '✓ ' : ''}${esc(t)}</span>`;
        }).join('')}
      </div>

      ${miss.length && !a ? `
        <p class="text-xs mt-3 mut bg-blue-50 dark:bg-slate-900 p-2.5 rounded-xl">
          💡 <b>Dica de capacitação:</b> para se destacar ainda mais nesta vaga, vale adquirir habilidades em: <b>${esc(miss.join(', '))}</b>.
          <a href="#" onclick="setTab('cursos');return false;" class="underline text-blue-600 font-medium ml-1">Veja cursos recomendados</a>.
        </p>
      ` : ''}

      ${a ? `
        <div class="mt-4 text-xs font-semibold px-3 py-2.5 rounded-xl text-center" style="background:${st[0]};color:${st[1]}">
          ${st[2]} (Inscrição Realizada)
        </div>
      ` : closed ? `
        <button disabled class="btn mt-4 opacity-60 cursor-not-allowed" style="background:var(--border);color:var(--muted)">Inscrições Encerradas</button>
      ` : `
        <button class="btn mt-4 py-2.5" onclick="applyJob('${j.id}')">🚀 Candidatar-se em 1 Clique</button>
      `}
    </div>
  `;
}

// 2. TELA: PAINEL DE TRIAGEM
function vEmpScreening() {
  const own = S.jobs.filter(j => j.owner_id === S.user.id);
  const job = own.find(j => j.id === S.selJob) || own[0];

  if (!own.length) {
    return `
      <div class="card rounded-2xl p-8 text-center mut space-y-3">
        <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200">🎯 Painel de Triagem</h3>
        <p class="text-sm">Você precisa publicar uma vaga antes de acessar o painel de triagem e match de candidatos.</p>
        <button onclick="setTab('vagas')" class="btn !w-auto mx-auto px-5">📢 Publicar Minha Primeira Vaga</button>
      </div>
    `;
  }

  // Filtragem de candidatos para a vaga selecionada
  let candidates = S.cands.map(c => ({
    c,
    s: score(c, job),
    applied: S.apps.find(a => a.job_id === job.id && a.candidate_id === c.user_id)
  }));

  // Filtro de status/inscrição
  if (S.filterStatus === 'inscritos') {
    candidates = candidates.filter(x => !!x.applied);
  } else if (S.filterStatus === 'match60') {
    candidates = candidates.filter(x => x.s >= 60);
  }

  // Filtro por Área Acadêmica
  if (S.filterArea) {
    candidates = candidates.filter(x => x.c.area === S.filterArea);
  }

  candidates.sort((a, b) => b.s - a.s);

  return `
    <div class="space-y-5">
      <!-- Topo do Painel de Triagem: Seletor de vaga e Franquia -->
      <div class="card rounded-2xl p-4 sm:p-5 shadow-xs space-y-4">
        <div class="flex items-center justify-between gap-3 flex-wrap pb-3 border-b">
          <div>
            <h2 class="font-bold text-xl flex items-center gap-2">🎯 Painel de Triagem de Talentos</h2>
            <p class="text-xs mut">Candidatos ranqueados pelo algoritmo inteligente de Match Score.</p>
          </div>
          <span class="tag font-bold" style="background:${S.freeUsed ? '#F3F4F6' : '#DCFCE7'};color:${S.freeUsed ? '#6B7280' : '#166534'}">
            ${S.freeUsed ? '🎁 Franquia grátis usada' : '🎁 1/1 Franquia Grátis disponível'}
          </span>
        </div>

        <!-- Seletor de Vaga Ativa -->
        <div class="grid sm:grid-cols-3 gap-3 items-end">
          <div class="sm:col-span-2">
            <label class="lb">Vaga em Triagem</label>
            <select onchange="pickJob(this.value)" class="fi">
              ${own.map(j => `
                <option value="${j.id}" ${j.id === (job ? job.id : '') ? 'selected' : ''}>
                  ${esc(j.cargo)} — ${esc(j.company)} (${j.status})
                </option>
              `).join('')}
            </select>
          </div>

          <div class="text-xs mut bg-blue-50 dark:bg-slate-900 p-2.5 rounded-xl border">
            <div><b>Local:</b> ${esc(job.bairro)} · <b>Turno:</b> ${esc(job.turno)}</div>
            ${job.area ? `<div><b>Área:</b> ${esc(job.area)}</div>` : ''}
          </div>
        </div>

        <!-- Barra de Filtros da Triagem -->
        <div class="flex flex-wrap gap-2 pt-2 items-center text-xs">
          <span class="lb mr-1">Filtrar:</span>
          ${chip('Todos os Candidatos', S.filterStatus === 'todos', "S.filterStatus='todos';render()")}
          ${chip('Apenas Inscritos na Vaga', S.filterStatus === 'inscritos', "S.filterStatus='inscritos';render()")}
          ${chip('Match Alto (≥ 60%)', S.filterStatus === 'match60', "S.filterStatus='match60';render()")}

          <select onchange="S.filterArea=this.value;render()" class="fi !mt-0 !py-1 text-xs sm:w-auto">
            <option value="">Todas as Áreas CNPq</option>
            ${Object.keys(CNPQ_AREAS).map(a => `<option value="${esc(a)}" ${S.filterArea === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}
          </select>
        </div>
      </div>

      <!-- Lista de Candidatos Ranqueados -->
      <div class="space-y-3">
        ${candidates.length ? candidates.map(r => candRow(r.c, job)).join('') : `
          <div class="card rounded-2xl p-8 text-center mut">
            <p class="text-base font-semibold">Nenhum candidato encontrado com estes critérios.</p>
            <p class="text-xs mt-1">Tente ajustar os filtros acima para visualizar mais perfis.</p>
          </div>
        `}
      </div>
    </div>
  `;
}

function candRow(c, j) {
  const sc = score(c, j);
  const un = S.unlocks.has(c.user_id);
  const a = S.apps.find(x => x.job_id === j.id && x.candidate_id === c.user_id);
  const col = sc >= 70 ? ['#DCFCE7', '#166534'] : sc >= 40 ? ['#FEF3C7', '#92400E'] : ['#F3F4F6', '#6B7280'];
  const msg = encodeURIComponent(`Olá ${c.name}! Vi seu perfil no ConectaNav e gostaria de agendar uma entrevista para a vaga de ${j.cargo}. Podemos conversar?`);
  const matched = getMatchedTags(c, j);

  return `
    <div class="card rounded-2xl p-4 sm:p-5 shadow-xs border">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <h4 class="font-bold text-base sm:text-lg">${esc(c.name)}</h4>
            ${a ? '<span class="tag text-[10px] font-bold" style="background:#FEF3C7;color:#92400E">📥 Candidatou-se</span>' : ''}
          </div>
          <p class="text-xs mut mt-0.5">${esc(c.age)} anos · 📍 ${esc(c.bairro)} · 🕐 ${esc(c.turno)}</p>
          ${c.area ? `
            <div class="mt-1 text-xs font-semibold text-blue-700 dark:text-blue-400 flex items-center gap-1.5 flex-wrap">
              <span>🏛️ ${esc(c.area)}</span>
              ${c.subarea ? `<span>· <i>${esc(c.subarea === 'Outro curso de Exatas' || c.subarea.startsWith('Outro') ? (c.custom_subarea || c.subarea) : c.subarea)}</i></span>` : ''}
            </div>
          ` : ''}
        </div>

        <div class="text-center shrink-0 px-3 py-1.5 rounded-xl border" style="background:${col[0]};color:${col[1]}">
          <div class="text-xl font-black leading-none">${sc}%</div>
          <div class="text-[9px] font-bold uppercase tracking-wider mt-0.5">MATCH</div>
        </div>
      </div>

      <!-- Habilidades / Tags do Candidato -->
      <div class="flex flex-wrap gap-1.5 mt-3">
        ${c.tags.map(t => {
          const isCommon = matched.includes(t);
          return `<span class="tag text-xs ${isCommon ? 'bg-green-100 text-green-900 font-bold border border-green-300' : ''}">${isCommon ? '★ ' : ''}${esc(t)}</span>`;
        }).join('')}
      </div>

      <!-- Cursos Concluídos do Candidato -->
      ${c.courses && c.courses.length ? `
        <div class="mt-3 text-xs p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border space-y-1">
          <div class="font-bold text-gray-700 dark:text-gray-300 flex items-center gap-1">
            <span>📜 Cursos Concluídos (${c.courses.length}):</span>
          </div>
          ${c.courses.map(k => `
            <div class="mut flex items-center justify-between gap-2">
              <span>• ${esc(k.name)} (${esc(k.hours)}h - ${esc(k.src)})</span>
              ${/^https:\/\//.test(k.url || '') ? `<a href="${esc(k.url)}" target="_blank" rel="noopener nofollow" class="underline text-blue-600 font-medium shrink-0">ver certificado</a>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}

      <!-- Status da Candidatura (se o candidato aplicou) -->
      ${a ? `
        <div class="mt-3 pt-3 border-t">
          <label class="lb">Status do Processo Seletivo</label>
          <select class="fi !mt-1 text-xs" onchange="setAppStatus('${a.id}', this.value)">
            ${STAT.map(s => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
      ` : ''}

      <!-- Botão de Ação: WhatsApp ou Desbloquear Contato -->
      <div class="mt-4 pt-3 border-t">
        ${un && S.phones[c.user_id] ? `
          <a class="btn !bg-emerald-600 hover:!bg-emerald-700 text-white shadow-sm flex items-center justify-center gap-2"
             href="https://wa.me/${esc(waNum(S.phones[c.user_id]))}?text=${msg}" target="_blank" rel="noopener">
            💬 Iniciar Conversa no WhatsApp (${esc(S.phones[c.user_id])})
          </a>
        ` : `
          <button class="btn2 shadow-sm flex items-center justify-center gap-2" onclick="unlock('${c.user_id}')">
            🔒 Desbloquear Contato WhatsApp ${!S.freeUsed ? '(Grátis 1x)' : '(R$ 15,00 via Pix)'}
          </button>
        `}
      </div>
    </div>
  `;
}

// ==================== VIEWS DE AUTENTICAÇÃO & ONBOARDING ====================
function vLogin() {
  const m = AUTH.mode, d = S.sent;
  const msg = d === 'confirm' ? '📧 Cadastro feito! Confirme seu e-mail pelo link que enviamos e depois entre com sua senha.' : d === 'reset' ? '📧 Enviamos um link para você criar uma nova senha.' : '';

  return `
    <div class="card rounded-2xl p-6 shadow-sm space-y-4 max-w-md mx-auto mt-4">
      <div class="text-center space-y-1 pb-2">
        <h2 class="font-bold text-2xl tracking-tight">${m === 'signup' ? 'Criar sua conta' : m === 'reset' ? 'Recuperar senha' : 'Entrar no ConectaNav'}</h2>
        <p class="text-xs sm:text-sm mut">Conectando vagas do comércio e talentos de Naviraí-MS.</p>
      </div>

      ${msg ? `
        <div class="p-3.5 rounded-xl text-sm font-medium bg-green-50 text-green-800 border border-green-200">${msg}</div>
      ` : `
        <div class="space-y-3">
          ${inp('E-mail', EMAIL, "EMAIL=this.value", 'voce@email.com', 'email')}
          ${m !== 'reset' ? inp('Senha', AUTH.pw, "AUTH.pw=this.value", 'mínimo 8 caracteres', 'password') : ''}
          ${m === 'signup' ? inp('Repita a senha', AUTH.pw2, "AUTH.pw2=this.value", '', 'password') : ''}
          <button class="btn py-2.5 mt-2" onclick="${m === 'signup' ? 'signUp()' : m === 'reset' ? 'resetPw()' : 'signIn()'}">
            ${m === 'signup' ? 'Criar conta' : m === 'reset' ? 'Enviar link de recuperação' : 'Entrar na Plataforma'}
          </button>
        </div>
      `}

      <div class="flex justify-between items-center text-xs font-semibold text-blue-600 pt-3 border-t">
        ${m === 'login' ? `
          <button onclick="authMode('signup')">Criar nova conta</button>
          <button onclick="authMode('reset')">Esqueci a senha</button>
        ` : `
          <button onclick="authMode('login')">← Voltar para a tela de login</button>
        `}
      </div>
    </div>
  `;
}

function vNewPw() {
  return `
    <div class="card rounded-2xl p-6 shadow-sm space-y-4 max-w-md mx-auto mt-4">
      <h2 class="font-bold text-xl">Crie sua nova senha</h2>
      ${inp('Nova senha', AUTH.pw, "AUTH.pw=this.value", 'mínimo 8 caracteres', 'password')}
      ${inp('Repita a senha', AUTH.pw2, "AUTH.pw2=this.value", '', 'password')}
      <button class="btn" onclick="setNewPw()">Salvar nova senha</button>
    </div>
  `;
}

function vOnboard() {
  return `
    <div class="card rounded-2xl p-6 shadow-sm space-y-5 max-w-md mx-auto mt-4">
      <div class="text-center space-y-1">
        <h2 class="font-bold text-2xl">Bem-vindo ao ConectaNav</h2>
        <p class="text-xs sm:text-sm mut">Como você deseja utilizar a plataforma?</p>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="OB.role='candidato';render()" class="chip rounded-2xl p-4 text-center font-bold flex flex-col items-center gap-1.5 ${OB.role === 'candidato' ? 'active' : ''}">
          <span class="text-2xl">🎓</span>
          <span class="text-sm">Sou Candidato</span>
          <span class="text-[10px] font-normal opacity-80">(16 a 29 anos)</span>
        </button>
        <button onclick="OB.role='empresa';render()" class="chip rounded-2xl p-4 text-center font-bold flex flex-col items-center gap-1.5 ${OB.role === 'empresa' ? 'active' : ''}">
          <span class="text-2xl">🏪</span>
          <span class="text-sm">Sou Empresa</span>
          <span class="text-[10px] font-normal opacity-80">(Comércio / PME)</span>
        </button>
      </div>

      <label class="flex items-start gap-2.5 text-xs mut cursor-pointer p-2 rounded-xl bg-slate-50 dark:bg-slate-900/50">
        <input type="checkbox" ${OB.consent ? 'checked' : ''} onchange="OB.consent=this.checked" class="mt-0.5">
        <span>Li e concordo com a <a href="#" onclick="showPrivacy();return false" class="underline text-blue-600 font-semibold">Política de Privacidade</a> e o tratamento de dados pessoais.</span>
      </label>

      <button class="btn py-3" onclick="createProfile()">Continuar</button>
    </div>
  `;
}

// ==================== PIX MODAL ====================
function pixModal() {
  if (!S.pix) return '';
  const c = S.cands.find(x => x.user_id === S.pix.id);
  const p = S.pix;

  return `
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background:rgba(0,0,0,.6)">
      <div class="card rounded-2xl p-6 w-full max-w-sm shadow-2xl text-center space-y-3">
        <h3 class="font-bold text-xl">Desbloquear Contato WhatsApp</h3>
        <p class="text-xs sm:text-sm mut">Sua 1ª franquia grátis já foi utilizada. No <b>Pay-per-Hire</b> você paga apenas para liberar o contato direto de ${esc(c ? c.name : 'candidato')}.</p>
        <div class="py-3 rounded-2xl bg-blue-50 dark:bg-slate-900 border">
          <div class="text-3xl font-extrabold text-blue-700">R$ 15,00</div>
          <div class="text-[11px] mut">Pagamento único via Pix com liberação imediata</div>
        </div>
        ${p.loading ? `
          <div class="py-6 mut text-sm animate-pulse">Gerando QR Code Pix…</div>
        ` : `
          <img alt="QR Code Pix" class="mx-auto w-48 h-48 rounded-xl shadow-xs" src="data:image/png;base64,${esc(p.qr_base64)}">
          <button class="btn2 mt-2" onclick="copyPix()">📋 Copiar código Pix</button>
          <p class="text-[11px] mut">Aguardando pagamento… esta tela fechará automaticamente quando confirmado.</p>
        `}
        <button class="mt-2 text-xs font-semibold text-gray-500 hover:text-gray-800" onclick="cancelPix()">Cancelar</button>
      </div>
    </div>
  `;
}

// ==================== SUB-NAVBAR COM ABAS INDIVIDUAIS ====================
function renderSubNav() {
  if (!S.user || !S.role) return '';

  if (S.role === 'candidato') {
    const appsCount = (S.apps || []).length;
    const coursesCount = (D.courses || []).length;
    return `
      <div class="max-w-4xl mx-auto px-4 flex gap-1 sm:gap-4 overflow-x-auto">
        <button onclick="setTab('cadastro')" class="tab-btn ${S.tab === 'cadastro' ? 'active' : ''}">
          👤 Cadastro & Meu Perfil
        </button>
        <button onclick="setTab('vagas')" class="tab-btn ${S.tab === 'vagas' ? 'active' : ''}">
          💼 Vagas ${appsCount ? `<span class="ml-1 text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-blue-100 text-blue-800">${appsCount}</span>` : ''}
        </button>
        <button onclick="setTab('cursos')" class="tab-btn ${S.tab === 'cursos' ? 'active' : ''}">
          🎓 Cursos ${coursesCount ? `<span class="ml-1 text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-green-100 text-green-800">${coursesCount}</span>` : ''}
        </button>
      </div>
    `;
  }

  if (S.role === 'empresa') {
    const own = S.jobs.filter(j => j.owner_id === S.user.id);
    return `
      <div class="max-w-4xl mx-auto px-4 flex gap-1 sm:gap-4 overflow-x-auto">
        <button onclick="setTab('vagas')" class="tab-btn ${S.tab === 'vagas' ? 'active' : ''}">
          📢 Publicar & Minhas Vagas ${own.length ? `<span class="ml-1 text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-blue-100 text-blue-800">${own.length}</span>` : ''}
        </button>
        <button onclick="setTab('triagem')" class="tab-btn ${S.tab === 'triagem' ? 'active' : ''}">
          🎯 Painel de Triagem
        </button>
      </div>
    `;
  }

  return '';
}

// ==================== RENDER PRINCIPAL ====================
function render() {
  // Badge no topo
  $('roleBadge').textContent = S.role ? (S.role === 'candidato' ? '🎓 Candidato' : '🏪 Empresa') : '';
  $('userActions').innerHTML = S.user ? `
    <button onclick="logout()" class="text-xs font-semibold px-2.5 py-1 rounded-lg border hover:bg-red-50 hover:text-red-700 transition" title="Sair da conta">Sair</button>
  ` : '';

  // Barra de abas individuais
  $('subnav').innerHTML = renderSubNav();

  let h;
  if (!sb) {
    h = '<div class="card rounded-2xl p-6 mt-6 max-w-md mx-auto"><h2 class="font-bold text-lg">Configuração pendente</h2><p class="text-xs mut mt-1">Preencha SUPABASE_URL e SUPABASE_ANON_KEY em <code>config.js</code>.</p></div>';
  } else if (S.loading) {
    h = '<div class="text-center mut mt-16 font-medium">Carregando ConectaNav…</div>';
  } else if (S.user && S.recovery) {
    h = vNewPw();
  } else if (!S.user) {
    h = vLogin();
  } else if (!S.role) {
    h = vOnboard();
  } else {
    // Roteamento de telas individuais
    if (S.role === 'candidato') {
      if (S.tab === 'cadastro') h = vCandProfile();
      else if (S.tab === 'cursos') h = vCandCourses();
      else h = vCandJobs();
    } else {
      if (S.tab === 'triagem') h = vEmpScreening();
      else h = vEmpJobs();
    }

    h += `
      <footer class="flex justify-center gap-4 text-xs mut mt-12 pt-6 border-t flex-wrap">
        <a href="#" onclick="showPrivacy();return false" class="underline">Política de Privacidade</a>
        <button onclick="logout()" class="underline">Encerrar Sessão</button>
        <button onclick="deleteAccount()" class="underline text-red-600">Excluir minha conta</button>
      </footer>
    `;
  }

  $('app').innerHTML = h;
  if (S.pix) $('modal').innerHTML = pixModal();
}

// Inicialização com Supabase Auth
if (sb) {
  sb.auth.onAuthStateChange((_e, ses) => {
    const u = ses && ses.user, rec = _e === 'PASSWORD_RECOVERY';
    if (u && S.user && u.id === S.user.id) {
      if (rec) { S.recovery = true; render(); }
      return;
    }
    if (u) {
      resetS();
      S.user = u;
      if (rec) S.recovery = true;
      setTimeout(loadAll, 0);
    } else {
      resetS();
      S.loading = false;
    }
    render();
  });
} else {
  S.loading = false;
  render();
}

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
</body>
</html>
